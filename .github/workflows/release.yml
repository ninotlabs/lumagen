name: Release

# Tag a version to ship it:
#   git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab (workflow_dispatch) to build+validate the
# artifacts without publishing a release (the publish job is tag-only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the artifacts (defaults to Cargo.toml)"
        required: false

# Least privilege at the top; each job widens only to what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build — portable zip + MSI
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC, for build-provenance attestation
      attestations: write # write the provenance attestation
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Build release binary
        run: cargo build --release --locked --bin lumagen

      - name: Package portable zip
        id: portable
        shell: pwsh
        run: |
          $V = "${{ steps.v.outputs.version }}"
          $name = "lumagen-$V-x86_64-windows-portable"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/lumagen.exe "dist/$name/"
          Copy-Item README.md, LICENSE-MIT "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
          "path=dist/$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Build MSI installer
        shell: bash
        # cargo-bundle's MSI bundler is experimental and broken ("Name is not a
        # valid value for column Data"); cargo-wix drives the WiX Toolset (present
        # on the windows-latest image) and is the reliable path. The UpgradeCode is
        # pinned so installs upgrade cleanly across releases; the ProductCode stays
        # fresh per build (Product Id="*"), as MSI expects. --no-build reuses the
        # binary from the "Build release binary" step.
        run: |
          cargo wix init --force --package lumagen --upgrade-guid 5A0976D2-AF56-48DC-990D-FEE57255C0CF
          cargo wix --no-build --nocapture --package lumagen

      - name: Collect MSI
        id: msi
        shell: pwsh
        run: |
          $V = "${{ steps.v.outputs.version }}"
          $src = Get-ChildItem target/wix/*.msi | Select-Object -First 1
          $dst = "dist/lumagen-$V-x86_64-windows.msi"
          Copy-Item $src.FullName $dst
          "path=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attest build provenance (SLSA)
        # Only for real releases (tag pushes) — records signed provenance for the
        # exact bytes we ship, verifiable with `gh attestation verify <file>
        # --repo pixhaus-app/lumagen`.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ steps.portable.outputs.path }}
            ${{ steps.msi.outputs.path }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumagen-windows-${{ steps.v.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumagen-windows-${{ steps.v.outputs.version }}-msi
          path: dist/*.msi
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    # Tag pushes only. workflow_dispatch builds+attests but never publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Human approval gate: the `release` environment (repo Settings → Environments)
    # has a required reviewer, so a v* tag cannot publish a release unreviewed.
    environment: release
    permissions:
      contents: write # create the Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail if the tag and Cargo.toml disagree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag  Cargo.toml=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $pkg"
            exit 1
          fi

      - name: Fail if the tagged commit is not on main
        # A tag can point at ANY commit — including one that never survived review
        # on main. Publish only what main actually contains.
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of origin/main — cut the tag from main"
            exit 1
          fi

      - name: Download portable zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumagen-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Download MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lumagen-windows-${{ needs.build.outputs.version }}-msi
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Lumagen ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/*.msi
          generate_release_notes: true
