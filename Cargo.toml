[workspace]
members = [".", "lumagen-core"]

[package]
name = "lumagen"
version = "0.1.0"
authors = ["Luis Morales <luismmorales@gmail.com>"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Lumagen — AI-assisted PBR material studio: generate, refine, and export texture map sets."
# Kept inside src/ (repo rule: no new top-level paths); embeds the Windows exe icon.
build = "src/build.rs"

# `cargo bundle --release --format msi` → target/release/bundle/msi/. The identifier is
# hashed into the MSI's stable product GUID — never change it, or installs stop upgrading
# each other and Windows sees two products.
[package.metadata.bundle]
name = "Lumagen"
identifier = "dev.lumagen.lumagen"
icon = ["reference/lumagen-brand-pack/windows/lumagen.ico"]
copyright = "Copyright © 2026 Lumagen"
short_description = "AI-assisted PBR material studio"
long_description = """
Lumagen generates complete PBR material map sets (albedo, roughness, metallic, normal,
AO, emission, transparency, displacement) from a material description, keeps every map
pixel-aligned to the albedo, and exports engine-ready PNG/EXR textures.
"""

# Without this table the [workspace.lints] denies below never fire for this crate.
[lints]
workspace = true

[dependencies]
lumagen-core = { path = "lumagen-core" }
# egui family pinned in lockstep per the eframe/egui skills (verified 0.34.2 API);
# wgpu pinned exactly as the skills mandate.
eframe = { version = "=0.36.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "persistence",
] }
egui = "=0.36.1"
egui_extras = { version = "=0.36.1", features = ["image"] }
egui-wgpu = "=0.36.1"
egui-phosphor = { version = "0.13", features = ["regular", "bold", "fill"] }
wgpu = "=29.0.4"
# Vertex/uniform POD casting for the hand-rolled wgpu PBR preview (Phase 4).
bytemuck = { version = "1", features = ["derive"] }
# wgpu-hal 29.0.4's DX12 suballocator mixes gpu-allocator's windows 0.58 types with its own
# windows-core; left to the resolver it pulls windows-core 0.62 and the two no longer unify
# (E0277 in wgpu-hal/dx12/suballocation.rs). Pin windows-core to the 0.58 line wgpu-hal 29
# was built against so a single, compatible version is selected.
windows-core = { version = "=0.58.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", features = ["backtrace"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
rfd = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
directories = "6"
# Secrets live in the OS credential vault (keyring skill): keyring-core is the library,
# the store is a per-platform provider crate, registered once at startup — not the `keyring`
# CLI aggregator.
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# Embeds the brand .ico + version info into the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Headless UI rendering for the visual-review tests (tests/ui_screens.rs): each screen is
# rendered off-screen via wgpu and written to target/ui_shots for inspection.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Documentation is encouraged by convention but not gated, consistent with the pedantic-doc
# lints already tuned off below (the moved data/maps modules predate the gate).
missing_docs = "allow"

[workspace.lints.clippy]
# Pedantic is on as the style floor, but tuned: the noisy style-only lints below are allowed
# so the gate can run at `-D warnings` and keep the correctness lints (unwrap/expect/panic)
# meaningful. The renderer is packed-RGBA8 math that is safe by construction under
# `unsafe_code = "forbid"`, so the float/int cast lints are noise there.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# ── pedantic style lints tuned off (see note above) ──
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
unreadable_literal = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
if_same_then_else = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
unnecessary_sort_by = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"
doc_markdown = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# A stock `dev` build of an egui app is painfully slow to interact with (immediate-mode UI
# redraws every frame with no optimizations). Optimize dependencies while keeping this
# crate's own codegen fast, so `cargo run` is usable for exploring the UI.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
